name: Build final Japanese analysis prompt DOCX files v2

on:
  push:
    branches:
      - chatgpt-prompt-docx-20260829
    paths:
      - 'prompt_builder_v2/**'
      - '.github/workflows/build-final-prompts-v2.yml'

permissions:
  contents: write

env:
  PYTHONUTF8: '1'

jobs:
  build-validate-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: chatgpt-prompt-docx-20260829
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install python-docx lxml pymupdf

      - name: Install rendering dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y libreoffice-writer fonts-noto-cjk

      - name: Generate and fully validate both Word documents
        run: |
          python prompt_builder_v2/generate_prompts.py --render

      - name: Show validation report
        run: |
          cat generated_prompt_docs_v2/validation_report.json
          ls -lh generated_prompt_docs_v2/*.docx

      - name: Commit validated DOCX files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add generated_prompt_docs_v2/Gaokao_Japanese_New_Format_Analysis_Prompt_With_Ruby.docx
          git add generated_prompt_docs_v2/Gaokao_Japanese_New_Format_Analysis_Prompt_No_Ruby.docx
          git add generated_prompt_docs_v2/validation_report.json
          if git diff --cached --quiet; then
            echo 'No generated changes to commit.'
          else
            git commit -m 'Generate validated final reusable Japanese analysis prompt DOCX files'
            git push origin HEAD:chatgpt-prompt-docx-20260829
          fi

      - name: Upload validated documents as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: final-reusable-japanese-analysis-prompts-v2
          path: |
            generated_prompt_docs_v2/Gaokao_Japanese_New_Format_Analysis_Prompt_With_Ruby.docx
            generated_prompt_docs_v2/Gaokao_Japanese_New_Format_Analysis_Prompt_No_Ruby.docx
            generated_prompt_docs_v2/validation_report.json
          if-no-files-found: error
          retention-days: 30
