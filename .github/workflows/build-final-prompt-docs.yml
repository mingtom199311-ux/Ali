name: Build final Japanese prompt DOCX package

on:
  push:
    branches:
      - chatgpt-prompt-docx-20260829
    paths:
      - scripts/build_final_prompt_docs.py
      - .github/workflows/build-final-prompt-docs.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install python-docx

      - name: Generate and validate Word documents
        run: |
          python scripts/build_final_prompt_docs.py
          python - <<'PY'
          from pathlib import Path
          import zipfile
          files = sorted(Path('dist').glob('*.docx'))
          assert len(files) == 2, files
          for path in files:
              assert zipfile.is_zipfile(path), path
              with zipfile.ZipFile(path) as zf:
                  assert zf.testzip() is None, path
                  assert 'word/document.xml' in zf.namelist(), path
              print(path.name, path.stat().st_size)
          PY

      - name: Upload two final Word documents
        uses: actions/upload-artifact@v4
        with:
          name: gaokao-japanese-final-prompts
          path: dist/*.docx
          if-no-files-found: error
          compression-level: 9
          retention-days: 30
